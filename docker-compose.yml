services:
  journal-db:
    container_name: journal-db
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-journal}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-journal-internal-db}
      POSTGRES_DB: ${POSTGRES_DB:-journal}
    volumes:
    - db_data:/var/lib/postgresql/data
    expose:
    - '5432'
    healthcheck:
      test:
      - CMD
      - nc
      - -z
      - localhost
      - '5432'
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      update_config:
        order: start-first
        parallelism: 1
      restart_policy:
        condition: any
  journal-api:
    container_name: journal-api
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile
    expose:
    - '4010'
    networks:
    - default
    - dokploy-network
    labels:
      traefik.enable: 'true'
      traefik.docker.network: dokploy-network
      traefik.http.routers.journal-web.rule: Host(`journal.facile.studio`)
      traefik.http.routers.journal-web.entrypoints: web
      traefik.http.routers.journal-web.middlewares: redirect-to-https@file
      traefik.http.routers.journal-web.service: journal-svc
      traefik.http.routers.journal-secure.rule: Host(`journal.facile.studio`)
      traefik.http.routers.journal-secure.entrypoints: websecure
      traefik.http.routers.journal-secure.tls.certresolver: letsencrypt
      traefik.http.routers.journal-secure.service: journal-svc
      traefik.http.services.journal-svc.loadbalancer.server.port: '4010'
    volumes:
    - avatar_data:/data/avatars
    environment:
      APP_ENV: ${APP_ENV:-production}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      DATABASE_URL: postgres://${POSTGRES_USER:-journal}:${POSTGRES_PASSWORD:-journal-internal-db}@journal-db:5432/${POSTGRES_DB:-journal}?sslmode=disable
      PORT: '4010'
      LOG_LEVEL: ${LOG_LEVEL:-info}
      INGEST_TOKEN: ${INGEST_TOKEN:-}
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-true}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_REDIRECT_URL: ${OIDC_REDIRECT_URL:-}
      OIDC_SUCCESS_URL: ${OIDC_SUCCESS_URL:-}
      OIDC_CLI_AUDIENCE: ${OIDC_CLI_AUDIENCE:-}
      SSO_ONLY: ${SSO_ONLY:-false}
      OIDC_CLAIMS_SCOPE: ${OIDC_CLAIMS_SCOPE:-}
      AVATAR_DIR: /data/avatars
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      RETENTION_DAYS: ${RETENTION_DAYS:-90}
      WEBHOOK_ALLOWED_HOSTS: ${WEBHOOK_ALLOWED_HOSTS:-}
    healthcheck:
      test:
      - CMD
      - nc
      - -z
      - localhost
      - '4010'
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      journal-db:
        condition: service_healthy
    deploy:
      update_config:
        order: start-first
        parallelism: 1
      restart_policy:
        condition: any
  journal-collector:
    container_name: journal-collector
    image: ghcr.io/facilestudio/journal/collector:latest
    restart: unless-stopped
    networks:
    - default
    volumes:
    - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      JOURNAL_URL: http://journal-api:4010/api
      JOURNAL_TOKEN: ${INGEST_TOKEN:-}
    labels:
      journal.ignore: 'true'
    depends_on:
      journal-api:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - nc
      - -z
      - localhost
      - '3000'
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      update_config:
        order: start-first
        parallelism: 1
      restart_policy:
        condition: any
networks:
  dokploy-network:
    external: true
volumes:
  db_data:
    name: journal_db_data
  avatar_data:
    name: journal_avatar_data
