services:
  db-password-fix:
    container_name: journal-db-password-fix
    image: docker:27-cli
    restart: "no"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: >
      sh -c "docker exec journal-db psql -U journal -d journal -c \"ALTER USER journal WITH PASSWORD 'journal-internal-db';\" && echo PASSWORD-RESET-OK"
    depends_on:
      journal-db:
        condition: service_healthy

  journal-db:
    container_name: journal-db
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-journal}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-journal-internal-db}
      POSTGRES_DB: ${POSTGRES_DB:-journal}
    volumes:
      - db_data:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-journal}"]
      interval: 5s
      timeout: 5s
      retries: 10

  journal-api:
    container_name: journal-api
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile
    expose:
      - "4010"
    networks:
      - default
      - dokploy-network
    labels:
      traefik.enable: "true"
      traefik.docker.network: dokploy-network
      traefik.http.routers.journal-web.rule: "Host(`journal.facile.studio`)"
      traefik.http.routers.journal-web.entrypoints: web
      traefik.http.routers.journal-web.middlewares: redirect-to-https@file
      traefik.http.routers.journal-web.service: journal-svc
      traefik.http.routers.journal-secure.rule: "Host(`journal.facile.studio`)"
      traefik.http.routers.journal-secure.entrypoints: websecure
      traefik.http.routers.journal-secure.tls.certresolver: letsencrypt
      traefik.http.routers.journal-secure.service: journal-svc
      traefik.http.services.journal-svc.loadbalancer.server.port: "4010"
    volumes:
      - avatar_data:/data/avatars
    environment:
      APP_ENV: ${APP_ENV:-production}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      DATABASE_URL: postgres://${POSTGRES_USER:-journal}:${POSTGRES_PASSWORD:-journal-internal-db}@journal-db:5432/${POSTGRES_DB:-journal}?sslmode=disable
      PORT: "4010"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      INGEST_TOKEN: ${INGEST_TOKEN:-}
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-true}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_REDIRECT_URL: ${OIDC_REDIRECT_URL:-}
      OIDC_SUCCESS_URL: ${OIDC_SUCCESS_URL:-}
      SSO_ONLY: ${SSO_ONLY:-false}
      OIDC_CLAIMS_SCOPE: ${OIDC_CLAIMS_SCOPE:-}
      AVATAR_DIR: /data/avatars
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      RETENTION_DAYS: ${RETENTION_DAYS:-90}
      WEBHOOK_ALLOWED_HOSTS: ${WEBHOOK_ALLOWED_HOSTS:-}
    healthcheck:
      test: ["CMD", "/api", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      journal-db:
        condition: service_healthy

  journal-collector:
    container_name: journal-collector
    profiles: ["collector"]
    restart: unless-stopped
    build:
      context: apps/collector
      dockerfile: Dockerfile
    networks:
      - default
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      JOURNAL_URL: http://journal-api:4010/api
      JOURNAL_TOKEN: ${INGEST_TOKEN:-}
    labels:
      journal.ignore: "true"
    depends_on:
      journal-api:
        condition: service_healthy

networks:
  dokploy-network:
    external: true

volumes:
  db_data:
    name: journal_db_data
  # Avatars are fetched from the identity provider and written here. Without a
  # volume they vanish on every redeploy and every dashboard shows a broken
  # image until each user signs in again.
  avatar_data:
    name: journal_avatar_data
