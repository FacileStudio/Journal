# The Facile suite's coding standard, enforced by filet.
# https://github.com/FacileStudio/filet
#
#   filet check .     the rules
#   filet gate .      format, rules, analyzers, tests, fuzz seeds, douane
#
# `preset: facile` is the suite standard: limits, style bans, failOn error and
# the router.go rule for apps/api/modules/*. A list or map written here would
# replace the preset's whole value, not extend it, so nothing is restated.
#
# .filet-baseline.json is the ratchet: filet fails when a (rule, path) count
# it holds grows or a new one appears, and with gen.baseline.stale when one
# drops until `filet check -baseline update .` lowers it. It counts findings
# at the failOn severity only, and every finding the preset reports here today
# is a warn or an info, so it is empty and stays a floor of zero.

preset: facile
kind: app
